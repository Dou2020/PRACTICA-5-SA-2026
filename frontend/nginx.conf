# Sirve el build del panel y hace de reverse proxy hacia los servicios: el
# navegador solo habla con :3000, así no hace falta CORS en ningún backend.
#
# Los destinos van en variables a propósito. Con un nombre literal en
# proxy_pass, nginx lo resuelve UNA vez al arrancar: si después se hace
# `docker compose stop payment-service` y se vuelve a levantar con otra IP, el
# proxy queda apuntando a la vieja. Con variables + el DNS de Docker
# (127.0.0.11) se resuelve en cada request, y el panel ve caer y volver a cada
# servicio, que es parte de la demo.
#
# Mismo mapeo que vite.config.ts (desarrollo). Si se toca uno, tocar el otro.
server {
    listen 80;
    root /usr/share/nginx/html;

    resolver 127.0.0.11 valid=5s ipv6=off;

    # Una orden con shipping en SLOW tarda ~9 s (dos timeouts con reintento);
    # el default de 60 s alcanza, pero el connect corto hace que un servicio
    # parado se vea como caído en 2 s y no en un minuto.
    proxy_connect_timeout 2s;
    proxy_read_timeout 30s;

    set $order     order-service:8081;
    set $payment   payment-service:8082;
    set $inventory inventory-service:8083;
    set $shipping  shipping-service:8084;

    # /api/orders/5 → /orders/5 ; /api/resilience/... → /resilience/...
    location /api/orders {
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://$order;
    }
    location /api/resilience/ {
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://$order;
    }
    location /api/inventory/ {
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://$inventory;
    }

    # Los tres /chaos son la misma ruta en servicios distintos.
    location = /api/chaos/payment {
        rewrite ^ /chaos break;
        proxy_pass http://$payment;
    }
    location = /api/chaos/inventory {
        rewrite ^ /chaos break;
        proxy_pass http://$inventory;
    }
    location = /api/chaos/shipping {
        rewrite ^ /chaos break;
        proxy_pass http://$shipping;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
